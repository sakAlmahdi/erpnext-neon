# Builds the custom ERPNext image (this repo's source) and pushes it to GHCR.
#
# Why the build context is frappe_docker and not this repo:
# images/layered/Containerfile does `COPY resources/core/*.sh` from its build
# context, so the context MUST be the frappe_docker checkout. This repo's code
# is never copied from the context -- `bench init` clones it from Git using
# apps.json. That is why this workflow checks out frappe_docker separately.
#
# Trigger manually from the Actions tab (workflow_dispatch).

name: Build custom ERPNext image

on:
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: "Frappe framework branch (source here is v17.0.0-dev -> use develop)"
        required: true
        default: "develop"
      tag:
        description: "Image tag to push"
        required: true
        default: "develop"
      app_branch:
        description: "Branch of THIS repo to bake into the image"
        required: true
        default: "develop"

concurrency:
  group: build-custom-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # This repo: needed for deploy/Containerfile.custom.
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: self

      # frappe_docker: the build context, because the final stage copies
      # resources/core/*.sh from it.
      - name: Checkout frappe_docker (build context)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Our Containerfile clones this repo itself into a directory named
      # "erpnext" (see deploy/Containerfile.custom for why). It needs the repo
      # URL with a token, passed as a BuildKit secret so the token never lands
      # in an image layer or in `docker image history`.
      - name: Write repo URL secret
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf 'https://x-access-token:%s@github.com/%s' \
            "$TOKEN" "${{ github.repository }}" > "$GITHUB_WORKSPACE/app_repo_url"
          echo "wrote app_repo_url for ${{ github.repository }}"

      # The Containerfile lives in THIS repo, but the build context must be the
      # frappe_docker checkout (the final stage copies resources/core/*.sh from
      # it). Copy ours in so both are reachable from one context.
      - name: Place Containerfile into build context
        run: cp self/deploy/Containerfile.custom frappe_docker/Containerfile.custom

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # plain progress: buildx otherwise collapses the failing RUN step and
      # the real bench error never reaches the log (that is how exit 167 hid).
      - name: Build and push
        env:
          BUILDKIT_PROGRESS: plain
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/Containerfile.custom
          push: true
          tags: ${{ steps.img.outputs.name }}:${{ inputs.tag }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ inputs.frappe_branch }}
            FRAPPE_IMAGE_PREFIX=frappe
            APP_BRANCH=${{ inputs.app_branch }}
          # Absolute path: relative secret-files paths are unreliable when the
          # build context is a subdirectory (docker/build-push-action#1326),
          # and this file is generated at runtime rather than committed.
          secret-files: |
            app_repo_url=${{ github.workspace }}/app_repo_url
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo '```'
            echo "CUSTOM_IMAGE=${{ steps.img.outputs.name }}"
            echo "CUSTOM_TAG=${{ inputs.tag }}"
            echo '```'
            echo ""
            echo "Set these in Coolify, then redeploy."
          } >> "$GITHUB_STEP_SUMMARY"
