# ERPNext (custom build from erpnext-develop) — Coolify deployment
# Staging use. See README-COOLIFY.md for the build + deploy procedure.
#
# Deploy in Coolify as: Resource -> Docker Compose
# Set CUSTOM_IMAGE / CUSTOM_TAG to the image you built and pushed.

x-customizable-image: &customizable_image
  # No fallback on purpose: a silent default would deploy stock ERPNext
  # instead of your custom build. Both vars are required.
  image: ${CUSTOM_IMAGE:?CUSTOM_IMAGE is required}:${CUSTOM_TAG:?CUSTOM_TAG is required}
  pull_policy: ${PULL_POLICY:-always}
  restart: ${RESTART_POLICY:-unless-stopped}

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *customizable_image]
  volumes:
    - sites:/home/frappe/frappe-bench/sites

services:
  # ---------------------------------------------------------------- data stores
  db:
    image: mariadb:11.8
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:7-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - redis-queue-data:/data

  # ---------------------------------------------------------------- one-shot init
  configurator:
    <<: *backend_defaults
    deploy:
      replicas: 1
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: 9000
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # Creates the site on first run; exits 0 afterwards if it already exists.
  create-site:
    <<: *customizable_image
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        SITE="${SITE_NAME:?SITE_NAME is required}"
        if [ -d "sites/$$SITE" ]; then
          echo "Site $$SITE already exists - skipping creation."
          exit 0
        fi
        bench new-site "$$SITE" --no-mariadb-socket --admin-password "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}" --db-root-password "${DB_PASSWORD:?DB_PASSWORD is required}" --install-app erpnext --set-default
        echo "Site $$SITE created."

  # ---------------------------------------------------------------- app services
  backend:
    <<: *backend_defaults
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    depends_on:
      create-site:
        condition: service_completed_successfully

  websocket:
    <<: [*depends_on_configurator, *customizable_image]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  queue-short:
    <<: *backend_defaults
    command: bench worker --queue short,default

  queue-long:
    <<: *backend_defaults
    command: bench worker --queue long,default,short

  scheduler:
    <<: *backend_defaults
    command: bench schedule

  # ---------------------------------------------------------------- entrypoint
  # Coolify routes its proxy to this service. Expose port 8080 in the UI
  # and attach your domain to it.
  frontend:
    <<: *customizable_image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    expose:
      - "8080"
    depends_on:
      - backend
      - websocket

volumes:
  sites:
  db-data:
  redis-cache-data:
  redis-queue-data:
